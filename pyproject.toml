[project]
name = "tessera-insights"
version = "0.2.2"
description = "See what you actually do with Claude: a local, redacted map of your Claude Code, Cowork and claude.ai sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude", "claude-code", "insights", "productivity", "visualization"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
tessera = "tessera.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures shared by import look like redefinitions
"tests/*" = ["F811"]
